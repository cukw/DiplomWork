<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="700" viewBox="0 0 1450 700">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#111"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0.45" flood-color="#111" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1450" height="700" fill="#ffffff"/>

  <g font-family="Times New Roman, serif" font-size="13" fill="#111111" stroke="#111111" stroke-width="1.15">
    <!-- Sequential decomposition blocks -->
    <g fill="#ffffff" filter="url(#shadow)">
      <rect x="120" y="80" width="185" height="78"/>
      <rect x="385" y="205" width="215" height="78"/>
      <rect x="665" y="330" width="215" height="78"/>
      <rect x="940" y="455" width="235" height="78"/>
    </g>
    <g fill="none">
      <rect x="120" y="80" width="185" height="78"/>
      <rect x="385" y="205" width="215" height="78"/>
      <rect x="665" y="330" width="215" height="78"/>
      <rect x="940" y="455" width="235" height="78"/>
    </g>

    <g stroke="none" fill="#111111" font-size="14">
      <text x="212" y="111" text-anchor="middle">
        <tspan x="212" dy="0">Собирать данные</tspan>
        <tspan x="212" dy="17">активности</tspan>
      </text>
      <text x="291" y="149" text-anchor="end" font-size="12">1</text>

      <text x="493" y="236" text-anchor="middle">
        <tspan x="493" dy="0">Обрабатывать</tspan>
        <tspan x="493" dy="17">и хранить события</tspan>
      </text>
      <text x="586" y="274" text-anchor="end" font-size="12">2</text>

      <text x="773" y="362" text-anchor="middle">
        <tspan x="773" dy="0">Анализировать</tspan>
        <tspan x="773" dy="17">активность</tspan>
      </text>
      <text x="866" y="399" text-anchor="end" font-size="12">3</text>

      <text x="1058" y="486" text-anchor="middle">
        <tspan x="1058" dy="0">Формировать отчеты</tspan>
        <tspan x="1058" dy="17">и уведомления</tspan>
      </text>
      <text x="1160" y="524" text-anchor="end" font-size="12">4</text>
    </g>

    <!-- Controls: each control enters exactly one block -->
    <path d="M212 50 V80" fill="none" marker-end="url(#arrow)"/>
    <path d="M493 50 V205" fill="none" marker-end="url(#arrow)"/>
    <path d="M773 50 V330" fill="none" marker-end="url(#arrow)"/>
    <path d="M1058 50 V455" fill="none" marker-end="url(#arrow)"/>
    <g stroke="none" fill="#111111">
      <text x="150" y="28">Политики мониторинга</text>
      <text x="425" y="28">Правила обработки</text>
      <text x="698" y="28">Регламенты безопасности</text>
      <text x="1010" y="28">Регламент отчетности</text>
    </g>

    <!-- Inputs -->
    <path d="M15 119 H120" fill="none" marker-end="url(#arrow)"/>
    <path d="M15 248 H385" fill="none" marker-end="url(#arrow)"/>
    <path d="M15 276 H385" fill="none" marker-end="url(#arrow)"/>
    <g stroke="none" fill="#111111">
      <text x="15" y="92">Активность</text>
      <text x="15" y="108">пользователей</text>
      <text x="15" y="218">Сведения о пользователях</text>
      <text x="15" y="234">и компьютерах</text>
      <text x="15" y="264">Настройки политик</text>
    </g>

    <!-- Main chain: 1 -> 2 -> 3 -> 4 -->
    <path d="M305 119 H350 V244 H385" fill="none" marker-end="url(#arrow)"/>
    <path d="M600 244 H635 V369 H665" fill="none" marker-end="url(#arrow)"/>
    <path d="M880 369 H910 V494 H940" fill="none" marker-end="url(#arrow)"/>
    <g stroke="none" fill="#111111">
      <text x="320" y="96">Первичные события</text>
      <text x="320" y="112">активности</text>
      <text x="615" y="220">Нормализованные</text>
      <text x="615" y="236">данные</text>
      <text x="895" y="345">Результаты</text>
      <text x="895" y="361">анализа</text>
    </g>

    <!-- Outputs and report inputs -->
    <path d="M880 394 H900 V506 H940" fill="none" marker-end="url(#arrow)"/>
    <path d="M1175 482 H1425" fill="none" marker-end="url(#arrow)"/>
    <path d="M1175 516 H1425" fill="none" marker-end="url(#arrow)"/>
    <g stroke="none" fill="#111111">
      <text x="910" y="432">Журнал аудита</text>
      <text x="910" y="448">и активности</text>
      <text x="1185" y="466">Аналитические отчеты</text>
      <text x="1185" y="502">Уведомления об аномалиях</text>
    </g>

    <!-- Mechanisms: each resource arrow enters a concrete block from below -->
    <path d="M160 610 V158" fill="none" marker-end="url(#arrow)"/>
    <path d="M240 610 V158" fill="none" marker-end="url(#arrow)"/>
    <path d="M455 610 V283" fill="none" marker-end="url(#arrow)"/>
    <path d="M540 610 V283" fill="none" marker-end="url(#arrow)"/>
    <path d="M773 610 V408" fill="none" marker-end="url(#arrow)"/>
    <path d="M1058 610 V533" fill="none" marker-end="url(#arrow)"/>

    <g stroke="none" fill="#111111">
      <text x="88" y="635">Endpoint-агенты</text>
      <text x="88" y="651">рабочих станций</text>
      <text x="225" y="635">Рабочие станции</text>
      <text x="410" y="635">PostgreSQL</text>
      <text x="410" y="651">базы данных</text>
      <text x="552" y="635">RabbitMQ</text>
      <text x="710" y="635">Backend-сервисы</text>
      <text x="710" y="651">и планировщики</text>
      <text x="1000" y="635">Web-панель</text>
      <text x="1000" y="651">и API Gateway</text>
    </g>
  </g>
</svg>
