<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    svg { background: #fff; font-family: 'Times New Roman', Times, serif; }
    .title { font-size: 24px; font-weight: 700; fill: #111; }
    .system-title { font-size: 20px; font-weight: 700; fill: #111; }
    .assoc { stroke: #222; stroke-width: 1.35; fill: none; }
    .include { stroke: #222; stroke-width: 1.35; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    .rel-label { font-size: 15px; fill: #111; font-style: italic; }
    .note { fill: #f7f2d4; stroke: #555; stroke-width: 1.1; }
    .note-text { font-size: 15px; fill: #111; }
  </style>

  <text class="title" x="800" y="42" text-anchor="middle">Диаграмма прецедентов системы мониторинга активности пользователей</text>

  <rect x="250" y="82" width="1050" height="860" rx="12" ry="12" fill="#fff" stroke="#222" stroke-width="2"/>
  <text class="system-title" x="275" y="116">Система учета и анализа компьютерной активности пользователей</text>

