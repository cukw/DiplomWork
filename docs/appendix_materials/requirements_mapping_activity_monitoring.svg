<g><polygon points="98,190 532,190 590,248 590,257 532,315 98,315 40,257 40,248" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="315" y="221.5" text-anchor="middle" font-size="25" font-weight="400" fill="#111"><tspan x="315" dy="0">Система должна обеспечивать</tspan><tspan x="315" dy="31">учет пользователей и рабочих</tspan><tspan x="315" dy="31">станций для контроля объектов</tspan></text></g>
<polygon points="640,252.5 710,218.5 710,234.5 1020,234.5 1020,270.5 710,270.5 710,286.5" fill="#fff" stroke="#111" stroke-width="1.5"/>
