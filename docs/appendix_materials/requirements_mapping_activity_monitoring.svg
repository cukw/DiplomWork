<g><polygon points="98,655 532,655 590,713 590,722 532,780 98,780 40,722 40,713" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="315" y="686.5" text-anchor="middle" font-size="25" font-weight="400" fill="#111"><tspan x="315" dy="0">Система должна обеспечивать</tspan><tspan x="315" dy="31">управление агентами,</tspan><tspan x="315" dy="31">политиками и командами</tspan></text></g>
