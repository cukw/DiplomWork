  <rect width="1500" height="980" fill="#fff"/>
  <style>svg { font-family: 'Times New Roman', Times, serif; }</style>
  <g><polygon points="98,35 532,35 590,93 590,102 532,160 98,160 40,102 40,93" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="315" y="66.5" text-anchor="middle" font-size="25" font-weight="400" fill="#111"><tspan x="315" dy="0">Система должна обеспечивать</tspan><tspan x="315" dy="31">авторизацию пользователей</tspan><tspan x="315" dy="31">и разграничение прав доступа</tspan></text></g>
<polygon points="640,97.5 710,63.5 710,79.5 1020,79.5 1020,115.5 710,115.5 710,131.5" fill="#fff" stroke="#111" stroke-width="1.5"/>
