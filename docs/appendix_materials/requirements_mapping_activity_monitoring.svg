<g><polygon points="98,345 532,345 590,403 590,412 532,470 98,470 40,412 40,403" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="315" y="376.5" text-anchor="middle" font-size="25" font-weight="400" fill="#111"><tspan x="315" dy="0">Система должна обеспечивать</tspan><tspan x="315" dy="31">сбор событий активности</tspan><tspan x="315" dy="31">с endpoint-агентов</tspan></text></g>
<polygon points="640,407.5 710,373.5 710,389.5 1020,389.5 1020,425.5 710,425.5 710,441.5" fill="#fff" stroke="#111" stroke-width="1.5"/>
