<g><polygon points="98,500 532,500 590,558 590,567 532,625 98,625 40,567 40,558" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="315" y="531.5" text-anchor="middle" font-size="25" font-weight="400" fill="#111"><tspan x="315" dy="0">Система должна выявлять</tspan><tspan x="315" dy="31">аномальные действия и</tspan><tspan x="315" dy="31">рассчитывать уровень риска</tspan></text></g>
