<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111111"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="0.6" flood-color="#111111" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1099" height="619" fill="none" stroke="#111111" stroke-width="1"/>

  <g font-family="Times New Roman, serif" fill="#111111" font-size="18">
    <rect x="350" y="180" width="400" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="550" y="248" text-anchor="middle">
      <tspan x="550" dy="0">Система учета и анализа</tspan>
      <tspan x="550" dy="24">компьютерной активности</tspan>
      <tspan x="550" dy="24">пользователей</tspan>
    </text>

    <!-- Left input flows -->
    <line x1="25" y1="215" x2="350" y2="215" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="158">Данные активности</text>
    <text x="80" y="180" font-size="15">рабочих станций</text>

    <line x1="25" y1="270" x2="350" y2="270" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="238">Сведения о пользователях</text>
    <text x="80" y="256" font-size="15">и компьютерах</text>

    <line x1="25" y1="320" x2="350" y2="320" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="294">Настройки политик</text>
    <text x="80" y="312" font-size="15">мониторинга</text>

    <!-- Top regulatory inputs -->
    <line x1="470" y1="30" x2="470" y2="180" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="365" y="48">Нормативные</text>
    <text x="365" y="70">требования</text>

    <line x1="645" y1="30" x2="645" y2="180" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="662" y="68">Регламенты</text>
    <text x="662" y="90">безопасности</text>

    <!-- Bottom actors -->
    <line x1="455" y1="575" x2="455" y2="340" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="475" y="475">Администратор</text>
    <text x="475" y="497">системы</text>

    <line x1="680" y1="575" x2="680" y2="340" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="700" y="475">Endpoint-агенты</text>
    <text x="700" y="497" font-size="15">на рабочих станциях</text>

    <!-- Right output flows -->
    <line x1="750" y1="215" x2="1070" y2="215" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="820" y="194">Аналитические отчеты</text>

    <line x1="750" y1="270" x2="1070" y2="270" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="820" y="238">Уведомления</text>
    <text x="820" y="254" font-size="15">об аномалиях</text>

    <line x1="750" y1="320" x2="1070" y2="320" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="820" y="294">Журнал аудита</text>
    <text x="820" y="310" font-size="15">и активности</text>
  </g>
</svg>
