<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4.5 L0,9" fill="none" stroke="#111" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#fff"/>

  <style>
    svg { font-family: "Times New Roman", Times, serif; }
    .container { fill:#fff; stroke:#111; stroke-width:1.8; }
    .state { fill:#fff; stroke:#111; stroke-width:1.7; }
    .choice { fill:#fff; stroke:#111; stroke-width:1.7; }
    .arrow { stroke:#111; stroke-width:1.45; fill:none; marker-end:url(#arrow); }
    .plain-line { stroke:#111; stroke-width:1.45; fill:none; }
    .label { fill:#111; font-size:18px; font-style:italic; }
    .small-label { fill:#111; font-size:16px; font-style:italic; }
    .title { fill:#111; font-size:24px; font-weight:700; }
    .state-text { fill:#111; font-size:19px; font-weight:700; }
  </style>

  <g id="activity-event-state-machine">
    <rect class="container" x="80" y="35" width="1240" height="950" rx="8" ry="8"/>
    <line class="plain-line" x1="80" y1="90" x2="1320" y2="90"/>
    <text class="title" x="700" y="71" text-anchor="middle">Обработка события активности</text>

    <circle cx="700" cy="120" r="13" fill="#111" stroke="#111" stroke-width="1.6"/>
    <line class="arrow" x1="700" y1="133" x2="700" y2="150"/>

    <g>
      <rect class="state" x="535" y="150" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="175" text-anchor="middle">
        <tspan x="700" dy="0">Событие зафиксировано</tspan>
        <tspan x="700" dy="22">endpoint-агентом</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="210" x2="700" y2="245"/>

    <g>
      <rect class="state" x="535" y="245" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="270" text-anchor="middle">
        <tspan x="700" dy="0">Сохранено</tspan>
        <tspan x="700" dy="22">в локальной очереди</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="305" x2="700" y2="322"/>
    <polygon class="choice" points="700,322 718,340 700,358 682,340"/>
    <text class="small-label" x="750" y="332" text-anchor="start">проверка связи</text>

    <path class="arrow" d="M 682 340 L 325 340 L 325 390"/>
    <text class="label" x="435" y="325" text-anchor="middle">[нет связи]</text>

    <path class="arrow" d="M 700 358 L 700 390"/>
    <text class="label" x="812" y="379" text-anchor="middle">[связь доступна]</text>

    <g>
      <rect class="state" x="160" y="390" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="325" y="415" text-anchor="middle">
        <tspan x="325" dy="0">Ожидание</tspan>
        <tspan x="325" dy="22">восстановления связи</tspan>
      </text>
    </g>

    <line class="arrow" x1="325" y1="450" x2="325" y2="500"/>

    <g>
      <rect class="state" x="160" y="500" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="325" y="525" text-anchor="middle">
        <tspan x="325" dy="0">Повторная</tspan>
        <tspan x="325" dy="22">отправка события</tspan>
      </text>
    </g>

    <path class="arrow" d="M 490 530 L 520 530 L 520 340 L 682 340"/>
    <text class="small-label" x="420" y="585" text-anchor="middle">повторная проверка</text>

    <g>
      <rect class="state" x="535" y="390" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="415" text-anchor="middle">
        <tspan x="700" dy="0">Передано</tspan>
        <tspan x="700" dy="22">в ActivityService</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="450" x2="700" y2="500"/>

    <g>
      <rect class="state" x="535" y="500" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="525" text-anchor="middle">
        <tspan x="700" dy="0">Сохранено</tspan>
        <tspan x="700" dy="22">в базе данных</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="560" x2="700" y2="600"/>

    <g>
      <rect class="state" x="535" y="600" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="625" text-anchor="middle">
        <tspan x="700" dy="0">Выполнен анализ</tspan>
        <tspan x="700" dy="22">уровня риска</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="660" x2="700" y2="682"/>
    <polygon class="choice" points="700,682 718,700 700,718 682,700"/>
    <text class="small-label" x="750" y="671" text-anchor="start">оценка результата</text>

    <path class="arrow" d="M 682 700 L 400 700 L 400 745"/>
    <text class="label" x="515" y="687" text-anchor="middle">[норма]</text>

    <path class="arrow" d="M 718 700 L 1020 700 L 1020 745"/>
    <text class="label" x="898" y="687" text-anchor="middle">[аномалия]</text>

    <g>
      <rect class="state" x="235" y="745" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="400" y="770" text-anchor="middle">
        <tspan x="400" dy="0">Учтено</tspan>
        <tspan x="400" dy="22">в метриках</tspan>
      </text>
    </g>

    <g>
      <rect class="state" x="835" y="745" width="370" height="60" rx="13" ry="13"/>
      <text class="state-text" x="1020" y="770" text-anchor="middle">
        <tspan x="1020" dy="0">Создана аномалия</tspan>
        <tspan x="1020" dy="22">и уведомление</tspan>
      </text>
    </g>

    <path class="arrow" d="M 400 805 L 400 850 L 682 850"/>
    <path class="arrow" d="M 1020 805 L 1020 850 L 718 850"/>
    <polygon class="choice" points="700,832 718,850 700,868 682,850"/>
    <text class="small-label" x="750" y="826" text-anchor="start">слияние ветвей</text>

    <line class="arrow" x1="700" y1="868" x2="700" y2="885"/>

    <g>
      <rect class="state" x="535" y="885" width="330" height="60" rx="13" ry="13"/>
      <text class="state-text" x="700" y="910" text-anchor="middle">
        <tspan x="700" dy="0">Включено</tspan>
        <tspan x="700" dy="22">в отчетные данные</tspan>
      </text>
    </g>

    <line class="arrow" x1="700" y1="945" x2="700" y2="956"/>
    <circle cx="700" cy="970" r="15" fill="#fff" stroke="#111" stroke-width="1.7"/>
    <circle cx="700" cy="970" r="9" fill="#111" stroke="#111" stroke-width="1.4"/>
  </g>
</svg>
