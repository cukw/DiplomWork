groups:
  - name: backend-slo-alerts
    rules:
      - alert: BackendHighHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service_name }}"
          description: "p95 latency is above 1s for at least 10 minutes."

      - alert: BackendHighHttpErrorRate
        expr: |
          (
            sum by (service_name) (rate(http_server_request_duration_seconds_count{status_code=~"5.."}[5m]))
            /
            clamp_min(sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service_name }}"
          description: "5xx error ratio is above 5% for at least 10 minutes."

      - alert: NotificationDeliveryQueueBacklog
        expr: notification_delivery_queue_depth > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification delivery queue backlog"
          description: "Pending/failed notification queue depth is above 200 for at least 10 minutes."

      - alert: NotificationDeliveryDlqGrowing
        expr: notification_delivery_dlq_depth > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Notification delivery DLQ is not empty"
          description: "Dead letter queue has messages for at least 5 minutes."
