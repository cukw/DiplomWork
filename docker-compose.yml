services:
  postgres-activity:
    image: postgres:16-alpine
    container_name: postgres-activity
    restart: unless-stopped
    environment:
      POSTGRES_DB: activities
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - ./Backend/services/ActivityService/db/initActivity.sql:/docker-entrypoint-initdb.d/10-initActivity.sql:ro
      - postgres_activity_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activities || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - ./Backend/services/AuthService/db/initAuthService.sql:/docker-entrypoint-initdb.d/10-initAuthService.sql:ro
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5434:5432"
    volumes:
      - ./Backend/services/UserService/db/initUserService.sql:/docker-entrypoint-initdb.d/10-initUserService.sql:ro
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-metrics:
    image: postgres:16-alpine
    container_name: postgres-metrics
    restart: unless-stopped
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5435:5432"
    volumes:
      - ./Backend/services/MetricsService/db/initMetricsService.sql:/docker-entrypoint-initdb.d/10-initMetricsService.sql:ro
      - postgres_metrics_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5436:5432"
    volumes:
      - ./Backend/services/NotificationService/db/initNotificationService.sql:/docker-entrypoint-initdb.d/10-initNotificationService.sql:ro
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-report:
    image: postgres:16-alpine
    container_name: postgres-report
    restart: unless-stopped
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5437:5432"
    volumes:
      - ./Backend/services/ReportService/db/initReportService.sql:/docker-entrypoint-initdb.d/10-initReportService.sql:ro
      - postgres_report_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reports || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-agent:
    image: postgres:16-alpine
    container_name: postgres-agent
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5438:5432"
    volumes:
      - ./Backend/services/AgentManagementService/db/InitAgent.sql:/docker-entrypoint-initdb.d/10-initAgent.sql:ro
      - postgres_agent_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agents || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    command:
      - sh
      - -c
      - rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server
    ports:
      - "127.0.0.1:15672:15672"   # Web UI (local admin only)
    expose:
      - "15692"                    # Prometheus metrics inside backend network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  activityservice:
    build:
      context: ./Backend/services/ActivityService
      dockerfile: dockerfile
    container_name: activityservice
    restart: unless-stopped
    depends_on:
      postgres-activity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      userservice:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-activity;Database=activities;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      AgentAuth__HeaderName: "${AGENT_AUTH_HEADER:-x-agent-token}"
      AgentAuth__Token: "${AGENT_AUTH_TOKEN:-}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__PublishRetryLimit: "3"
      RabbitMQ__DispatcherPollMs: "1000"
      RabbitMQ__DispatcherBatchSize: "100"
      Services__User: "http://userservice:5004"
    ports:
      - "5001:5001"   # gRPC
      - "5002:5002"   # health / http
    networks:
      - backend

  authservice:
    build:
      context: ./Backend/services/AuthService
      dockerfile: dockerfile
    container_name: authservice
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-auth;Database=auth;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      Jwt__Key: "${JWT_KEYS_V1:-${JWT_KEY:?JWT_KEYS_V1 or JWT_KEY is required}}"
      Jwt__ActiveKeyId: "${JWT_ACTIVE_KEY_ID:-v1}"
      Jwt__Keys__v1: "${JWT_KEYS_V1:-${JWT_KEY:?JWT_KEYS_V1 or JWT_KEY is required}}"
      Jwt__Keys__v2: "${JWT_KEYS_V2:-}"
      Jwt__RequireHttpsMetadata: "${JWT_REQUIRE_HTTPS_METADATA:-true}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "https://localhost:3443"
    ports:
      - "5003:5003"   # gRPC
      - "5007:5007"   # REST
    networks:
      - backend

  userservice:
    build:
      context: ./Backend/services/UserService
      dockerfile: dockerfile
    container_name: userservice
    restart: unless-stopped
    depends_on:
      postgres-user:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-user;Database=users;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      ASPNETCORE_URLS: "http://+:5004;http://+:5005"
    ports:
      - "5004:5004"   # gRPC
      - "5005:5005"   # REST
    networks:
      - backend

  metricservice:
    build:
      context: ./Backend/services/MetricsService
      dockerfile: dockerfile
    container_name: metricservice
    restart: unless-stopped
    depends_on:
      postgres-metrics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-metrics;Database=metrics;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__PrefetchCount: "16"
      RabbitMQ__RetryLimit: "5"
      ASPNETCORE_URLS: "http://+:5010;http://+:5011"
    ports:
      - "5010:5010"   # gRPC
      - "5011:5011"   # REST
    networks:
      - backend

  notificationservice:
    build:
      context: ./Backend/services/NotificationService
      dockerfile: dockerfile
    container_name: notificationservice
    restart: unless-stopped
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      userservice:
        condition: service_started
      authservice:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-notification;Database=notifications;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__PrefetchCount: "16"
      RabbitMQ__RetryLimit: "5"
      Delivery__Retry__Enabled: "true"
      Delivery__Retry__MaxAttempts: "5"
      Delivery__Retry__InitialDelaySeconds: "30"
      Delivery__Retry__MaxDelaySeconds: "900"
      Delivery__Retry__PollIntervalSeconds: "15"
      Delivery__Retry__BatchSize: "100"
      Services__User: "http://userservice:5004"
      Services__Auth: "http://authservice:5003"
    ports:
      - "5012:5012"   # gRPC
      - "5017:5017"   # REST
    networks:
      - backend

  activityagent:
    # Demo generator. Enable explicitly with:
    # docker compose --profile demo up --build -d activityagent
    profiles:
      - demo
    build:
      context: ./Backend/services/ActivityAgent
      dockerfile: dockerfile
    container_name: activityagent
    restart: unless-stopped
    depends_on:
      activityservice:
        condition: service_healthy
    environment:
      ActivityService__Url: "http://activityservice:5001"
      AgentAuth__HeaderName: "${AGENT_AUTH_HEADER:-x-agent-token}"
      AgentAuth__Token: "${AGENT_AUTH_TOKEN:-}"
      Agent__ComputerId: "1"
      Agent__CollectionInterval: "5000"
      Agent__Enabled: "true"
    networks:
      - backend

  reportservice:
    build:
      context: ./Backend/services/ReportService
      dockerfile: dockerfile
    container_name: reportservice
    restart: unless-stopped
    depends_on:
      postgres-report:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-report;Database=reports;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__PrefetchCount: "16"
      RabbitMQ__RetryLimit: "5"
      ASPNETCORE_URLS: "http://+:5013;http://+:5014"
    ports:
      - "5013:5013"   # gRPC
      - "5014:5014"   # REST
    networks:
      - backend

  agentmanagementservice:
    build:
      context: ./Backend/services/AgentManagementService
      dockerfile: dockerfile
    container_name: agentmanagementservice
    restart: unless-stopped
    depends_on:
      postgres-agent:
        condition: service_healthy
      userservice:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-agent;Database=agents;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
      ASPNETCORE_URLS: "http://+:5015;http://+:5016"
      Services__User: "http://userservice:5004"
      AgentAuth__HeaderName: "${AGENT_AUTH_HEADER:-x-agent-token}"
      AgentAuth__Token: "${AGENT_AUTH_TOKEN:-}"
      AgentSigning__KeyId: "${AGENT_SIGNING_KEY_ID:-default}"
      AgentSigning__Secret: "${AGENT_SIGNING_SECRET:-}"
    ports:
      - "5015:5015"   # gRPC
      - "5016:5016"   # REST
    networks:
      - backend

  gateway:
    build:
      context: ./Backend/gateway
      dockerfile: dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: gateway
    restart: unless-stopped
    depends_on:
      activityservice:
        condition: service_healthy
      authservice:
        condition: service_healthy
      userservice:
        condition: service_healthy
      metricservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
      reportservice:
        condition: service_healthy
      agentmanagementservice:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Jwt__Key: "${JWT_KEYS_V1:-${JWT_KEY:?JWT_KEYS_V1 or JWT_KEY is required}}"
      Jwt__ActiveKeyId: "${JWT_ACTIVE_KEY_ID:-v1}"
      Jwt__Keys__v1: "${JWT_KEYS_V1:-${JWT_KEY:?JWT_KEYS_V1 or JWT_KEY is required}}"
      Jwt__Keys__v2: "${JWT_KEYS_V2:-}"
      Jwt__Issuer: "ActivityMonitoringSystem"
      Jwt__Audience: "ActivityMonitoringSystem"
      Jwt__RequireHttpsMetadata: "${JWT_REQUIRE_HTTPS_METADATA:-true}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "https://localhost:3443"
      Services__Activity: "http://activityservice:5001"
      Services__ActivityHttp: "http://activityservice:5002"
      Services__Auth: "http://authservice:5003"
      Services__User: "http://userservice:5004"
      Services__Notification: "http://notificationservice:5012"
      Services__Metrics: "http://metricservice:5010"
      Services__Report: "http://reportservice:5013"
      Services__Agent: "http://agentmanagementservice:5015"
      AgentAuth__HeaderName: "${AGENT_AUTH_HEADER:-x-agent-token}"
      AgentAuth__Token: "${AGENT_AUTH_TOKEN:-}"
      ConnectionStrings__GatewayRuntime: "Host=postgres-user;Database=users;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=true"
    ports:
      - "8080:8080"
    volumes:
      - gateway_data:/app/data
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/backend-alerts.yml:/etc/prometheus/alerts/backend-alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    depends_on:
      gateway:
        condition: service_started
      activityservice:
        condition: service_started
      authservice:
        condition: service_started
      notificationservice:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
      args:
        - REACT_APP_API_URL=/api
        - REACT_APP_ENV=production
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./Frontend/certs:/etc/nginx/ssl:ro
    networks:
      - backend
      - frontend
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=/api
      - REACT_APP_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_activity_data:
  postgres_auth_data:
  postgres_user_data:
  postgres_metrics_data:
  postgres_notification_data:
  postgres_report_data:
  postgres_agent_data:
  rabbitmq_data:
  gateway_data:
  prometheus_data:
  grafana_data:
