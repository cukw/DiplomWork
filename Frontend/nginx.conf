limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

map $request_uri $is_suspicious_uri {
    default 0;
    ~*(\.\./|%2e%2e|union(\s+all)?\s+select|<script|/etc/passwd|/phpmyadmin|/wp-admin) 1;
}

map $request_method $method_allowed {
    default 0;
    GET 1;
    POST 1;
    PUT 1;
    PATCH 1;
    DELETE 1;
    OPTIONS 1;
    HEAD 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;
    client_max_body_size 10m;
    limit_conn per_ip_conn 50;

    if ($method_allowed = 0) {
        return 405;
    }

    if ($is_suspicious_uri = 1) {
        return 403;
    }

    # Включаем gzip сжатие для оптимизации
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # Обрабатываем статические ресурсы с кэшированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Особая обработка для index.html - не кэшируем долго
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Для всех остальных запросов отдаем index.html (поддержка React Router)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Не кэшируем динамические запросы
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        
        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }

    location /api/auth/ {
        limit_req zone=auth_rate burst=20 nodelay;

        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API прокси - перенаправляем все запросы к API на gateway
    location /api/ {
        limit_req zone=api_rate burst=120 nodelay;

        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Обработка ошибок
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

