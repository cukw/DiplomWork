name: Local Endpoint Agent Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag for manual publish (e.g. v0.2.0)"
        required: false
        type: string
      release_name:
        description: "Optional custom release title"
        required: false
        type: string
      prerelease:
        description: "Mark manual release as prerelease"
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-linux-deb:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require production agent token for release artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        env:
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          if [ -z "${AGENT_AUTH_TOKEN}" ]; then
            echo "GitHub secret AGENT_AUTH_TOKEN is required before publishing agent release artifacts." >&2
            exit 1
          fi

      - name: Build .deb package
        env:
          GATEWAY_URL: "https://2.26.89.86"
          GATEWAY_TLS_INSECURE: "true"
          ACTIVITY_SERVICE_URL: "2.26.89.86:5001"
          AGENT_MANAGEMENT_URL: "2.26.89.86:5015"
          AGENT_AUTH_HEADER: "x-agent-token"
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          chmod +x LocalEndpointAgent/scripts/build_linux_deb.sh
          bash LocalEndpointAgent/scripts/build_linux_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-endpoint-agent-linux
          path: |
            LocalEndpointAgent/dist/linux/local-endpoint-agent_*_amd64.deb
            LocalEndpointAgent/dist/linux/endpoint-agent-linux
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS (bin + dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require production agent token for release artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        env:
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          if [ -z "${AGENT_AUTH_TOKEN}" ]; then
            echo "GitHub secret AGENT_AUTH_TOKEN is required before publishing agent release artifacts." >&2
            exit 1
          fi

      - name: Build macOS binary and dmg
        env:
          GATEWAY_URL: "https://2.26.89.86"
          GATEWAY_TLS_INSECURE: "true"
          ACTIVITY_SERVICE_URL: "2.26.89.86:5001"
          AGENT_MANAGEMENT_URL: "2.26.89.86:5015"
          AGENT_AUTH_HEADER: "x-agent-token"
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          chmod +x LocalEndpointAgent/scripts/build_macos_bin.sh
          chmod +x LocalEndpointAgent/scripts/build_macos_dmg.sh
          bash LocalEndpointAgent/scripts/build_macos_dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-endpoint-agent-macos
          path: |
            LocalEndpointAgent/dist/macos/endpoint-agent-macos
            LocalEndpointAgent/dist/macos/endpoint-agent-macos.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require production agent token for release artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        shell: pwsh
        env:
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AGENT_AUTH_TOKEN)) {
            throw "GitHub secret AGENT_AUTH_TOKEN is required before publishing agent release artifacts."
          }

      - name: Build .exe package
        shell: pwsh
        env:
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          ./LocalEndpointAgent/scripts/build_windows_exe.ps1 `
            -GatewayUrl "https://2.26.89.86" `
            -ActivityServiceUrl "2.26.89.86:5001" `
            -AgentManagementUrl "2.26.89.86:5015" `
            -AgentAuthHeader "x-agent-token" `
            -AgentAuthToken "$env:AGENT_AUTH_TOKEN" `
            -GatewayTlsInsecure $true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-endpoint-agent-windows
          path: LocalEndpointAgent/dist/windows/endpoint-agent-windows.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    needs:
      - build-linux-deb
      - build-macos
      - build-windows-exe
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: local-endpoint-agent-linux
          path: _release/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: local-endpoint-agent-macos
          path: _release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: local-endpoint-agent-windows
          path: _release/windows

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd _release
          find . -type f | sed 's|^\./||' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_RELEASE_TAG}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "release_tag is required for workflow_dispatch publish" >&2
            exit 1
          fi

          name="${INPUT_RELEASE_NAME:-Local Endpoint Agent ${tag}}"
          prerelease="false"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${INPUT_PRERELEASE}" == "true" ]]; then
            prerelease="true"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            _release/linux/*
            _release/macos/*
            _release/windows/*
            _release/SHA256SUMS.txt
